services:
  - type: web
    name: job-queue-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TYPEORM_SYNC
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: job-queue-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: job-queue-db
    plan: free
